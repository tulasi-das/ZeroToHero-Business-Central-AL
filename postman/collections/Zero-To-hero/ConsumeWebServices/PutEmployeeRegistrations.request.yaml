$kind: http-request
description: |-
  This is a POST request, submitting data to an API via the request body. This request submits JSON data, and the data is reflected in the response.

  A successful POST request typically returns a `200 OK` or `201 Created` response code.
url: http://localhost:3000/PutEmployeeRegistrations
method: PUT
body:
  type: json
  content: |-
    {
        "EmployeeRegistrationNumber": 20,
        "EmployeeRegistrationStatus": "Draft",
        "EmployeeName": "Cristiano",
        "EmployeeAge": 40,
        "EmployeGender": "Male",
        "LineNumber": 1,
        "RegistrationDepartment": "ECE",
        "SalaryExpectations": 10000,
        "DesignationName": "Associate Professor"
    }
scripts:
  - type: afterResponse
    code: |
      pm.test("Successful POST request", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
    language: text/javascript
order: 3000
